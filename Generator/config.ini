; ============================================================
; PlumeDEBuG Configuration File
; Plume-Data Empowered Bubble-image Generator
; ============================================================
; This configuration file follows the parameter naming and
; definitions described in the PlumeDEBuG manuscript.
; See Table 2 in the paper for parameter descriptions.
; ============================================================

[General]
; Number of synthetic images to generate (N_img)
num_synthetic_images = 10
; Maximum bubbles per image (n_max)
max_bubbles_per_image = 200
; Target void fraction (stop condition: generation halts if reached)
target_void_fraction = 1.0
; Output directory
output_dir = output
; Default background grayscale value (0-255, used when no background image)
default_background_value = 200

[Placement]
; Placement mode: "Gaussian" or "Random" (Section 3.3.4)
placement_mode = Gaussian

; Overlap threshold w_ol (Eq. 6-7, default: 0.4)
; Maximum allowed occlusion ratio for any existing bubble
overlap_control = 0.4

; Gaussian placement parameters (Eq. 10)
; ROI left boundary as fraction of canvas width (x_min)
gaussian_x_min_ratio = 0.30
; ROI right boundary as fraction of canvas width (x_max)
gaussian_x_max_ratio = 0.70
; Gaussian scale divisor sigma_div (default: 4, recommended: 4-6)
gaussian_scale_divisor = 4.0

; Plume growth (Eq. 9): W(y) = W_0 + 2*k*y
; Enable trapezoid ROI for plume growth simulation
use_trapezoid_roi = True
; Plume growth rate k (default: 0.1)
entrainment_slope = 0.1
; ROI width at bottom W_0 as fraction of canvas width (default: 0.2)
base_width_ratio = 0.20

[Filters]
; Feathering / Rendering parameters (Section 3.4)
; Enable feathering for soft bubble blending
apply_feathering = True

; Erosion kernel size k_e in pixels (Eq. 12, must be odd, square kernel k_e x k_e)
; Paper specifies square structuring element
feather_erosion_kernel_size = 3
; Erosion iterations n_e
feather_erosion_iterations = 1

; Gaussian kernel size k_g in pixels (Eq. 14, must be odd)
feather_kernel_size = 7
; Gaussian blur sigma sigma_g (Eq. 15)
feather_sigma = 1.0

[Background]
; Use a real experimental image as background
use_background_image = True
; Path to background image
background_image_path = ../dataset/background_tank.tif

[Database]
; Path to bubble image database directory
database_path = Database
; Path to aggregated SQLite database
aggregated_results_path = Aggregated_bubble_data/aggregated_results.db

; ============================================================
; Bubble Size Distribution (Section 3.2)
; ============================================================
; distribution_type: gaussian, weibull, lognormal, bimodal, uniform
; selection_method: direct_pdf or weighted_sampling (default)

[Distribution]
distribution_type = lognormal
selection_method = weighted_sampling

; --- Gaussian: f(r) = (1/(sigma*sqrt(2*pi))) * exp(-(r-mu)^2 / (2*sigma^2))
[Gaussian]
; mu: mean diameter (meters)
mu = 0.002
; sigma: standard deviation (meters)
sigma = 0.002

; --- Weibull: f(r) = (k/lambda) * (r/lambda)^(k-1) * exp(-(r/lambda)^k)
[Weibull]
; k_d: shape parameter (dimensionless)
weibull_shape = 1.0
; lambda: scale parameter (meters)
weibull_scale = 0.004

; --- Lognormal: f(r) = (1/(r*sigma_ln*sqrt(2*pi))) * exp(-(ln(r)-mu_ln)^2 / (2*sigma_ln^2))
[Lognormal]
; mu_ln: log-mean
lognormal_mu = -5.8
; sigma_ln: log-standard deviation
lognormal_sigma = 0.5

; --- Bimodal: f(r) = w1*N(mu1,sigma1) + (1-w1)*N(mu2,sigma2)
[Bimodal]
; mu1: mean of first Gaussian (meters)
mu1 = 0.002
; sigma1: std of first Gaussian (meters)
sigma1 = 0.0005
; mu2: mean of second Gaussian (meters)
mu2 = 0.005
; sigma2: std of second Gaussian (meters)
sigma2 = 0.001
; w1: mixing weight for first Gaussian
weight1 = 0.6

; --- Uniform: f(r) = 1/(2*delta), r in [r0-delta, r0+delta]
[Uniform]
; r0: central diameter (meters)
r0 = 0.003
; delta: symmetric range around r0 (meters)
delta = 0.001

; ============================================================
; EXPERIMENTAL FEATURES
; These features are not described in the current manuscript.
; Enable at your own discretion for exploratory use.
; ============================================================

[Experimental_MixedMode]
; Mixed mode: randomizes parameters across batches for diverse datasets
; - Random bubble count: max_bubbles +/- 50
; - Random placement mode: Gaussian or Random
; - 30% variation on overlap, entrainment, base_width
; - Re-randomized every 10% of total images
enable_mixed_mode = False

[Experimental_VelocityBias]
; Velocity-based bubble size bias:
; Large bubbles prefer high-velocity center regions
; Small bubbles distributed more uniformly
enable_velocity_size_bias = False
; Velocity profile exponent (higher = more peaked)
velocity_profile_exponent = 2.0
; Size-velocity coupling strength (0=none, 1=moderate, 2=strong)
size_velocity_coupling = 1.5
; Vertical velocity decay (0=no decay)
velocity_vertical_decay = 0.0

[Experimental_CumulativeOverlap]
; Cumulative overlap threshold (in addition to single-bubble threshold)
; Reject placement if total intersection / new_bubble_area > threshold
; Set to 0 to disable (paper only describes single-threshold)
enable_cumulative_overlap = False
; Cumulative threshold multiplier (applied as overlap_control * this value)
cumulative_threshold_multiplier = 1.5